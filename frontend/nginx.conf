server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames (index-<hash>.js/css) are safe to cache forever;
    # index.html is not, since it's the one file that changes on every deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router client-side routes (e.g. /claims/8/documents) have no
    # matching file on disk, so unknown paths fall back to index.html and the
    # app's own router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
